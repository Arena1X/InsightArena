# Local development dependencies for InsightArena.
#
#   docker compose up -d          # start Postgres
#   docker compose --profile tools up -d   # also start Adminer (DB UI)
#   docker compose down           # stop (data is kept in the pgdata volume)
#   docker compose down -v        # stop and wipe the local database
#
# The defaults below match backend/.env.example, so `cp .env.example .env`
# in backend/ is enough for the API to connect. Override any value by
# exporting it (or putting it in a root-level .env) before `docker compose up`.

name: insightarena

services:
  postgres:
    image: postgres:16-alpine
    container_name: insightarena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightarena}
      POSTGRES_DB: ${POSTGRES_DB:-insightarena}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-insightarena} -d ${POSTGRES_DB:-insightarena}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: insightarena-adminer
    profiles: ['tools']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '${ADMINER_PORT:-8080}:8080'

volumes:
  pgdata:
